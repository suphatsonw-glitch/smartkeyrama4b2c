<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#0d2e1a">
<title>คีย์ยอดพระราม 4 · Delish Foods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root { color-scheme: only light; }
[hidden] { display: none !important; }
button { color: #1a2a1a; }
:root { --deep: #0d2e1a; --g: #1a4a2e; --gb: #2d8a52; --gl: #e8f5ee; --line: #d6e4da; --muted: #5f7f5f; --text: #1a2a1a; --bad: #c0392b; --grab: #00a24a; --lm: #0b7a3e; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { font-family: 'Sarabun', 'Noto Sans Thai', system-ui, sans-serif; font-size: 16px; line-height: 1.45; color: var(--text); background: #eef3ef; }
button, input, select, textarea { font: inherit; }
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 980px; margin: 0 auto; background: #f4f7f5; }
.topbar { flex: none; display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; background: linear-gradient(135deg, #0d2e1a, #1a4a2e); color: #fff; }
.tb-home { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); color: #fff; text-decoration: none; font-size: 19px; }
.tb-logo { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,.15); font-size: 22px; }
.tb-txt { flex: 1; min-width: 0; } .tb-txt b { display: block; font-size: 17px; } .tb-txt small { color: rgba(255,255,255,.78); font-size: 12.5px; }
.tb-day { font-size: 13px; font-weight: 800; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.25); border-radius: 99px; padding: 4px 12px; white-space: nowrap; }
.tabs { flex: none; display: flex; background: #fff; border-bottom: 2px solid var(--line); }
.tab { flex: 1; min-height: 48px; border: 0; background: none; font-weight: 800; font-size: 14.5px; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; cursor: pointer; }
.tab.on { color: var(--gb); border-bottom-color: var(--gb); background: linear-gradient(180deg, #fff 30%, var(--gl)); }
.view { flex: 1; overflow-y: auto; padding: 14px 14px 24px; }
.dock { flex: none; display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); background: #fff; border-top: 1px solid var(--line); }
@media (pointer: coarse) { .dock { padding-bottom: calc(10px + 1in + env(safe-area-inset-bottom, 0px)); } }
.card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
.card h2 { margin: 0 0 10px; font-size: 17px; color: var(--g); }
.btn { min-height: 46px; border-radius: 12px; border: 1.5px solid #cfe0d4; background: #fff; color: var(--g); font-weight: 800; padding: 0 14px; cursor: pointer; }
.btn:disabled { opacity: .45; cursor: default; } .btn.pri { background: linear-gradient(135deg, #2d8a52, #1a6b3c); color: #fff; border: 0; } .btn.grow { flex: 1; } .btn.block { width: 100%; }
.btn.sm { min-height: 38px; font-size: 14px; padding: 0 12px; }
.dock .btn { white-space: nowrap; padding: 0 8px; }
@media (max-width: 480px) { .dock .btn { font-size: 14px; padding: 0 4px; } .tb-txt small { display: none; } .dock { gap: 6px; } }
.note { font-size: 13.5px; color: var(--muted); }
.warn { background: #fff6e0; border: 1px solid #f0d58a; color: #6b4e00; border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
.emp { text-align: center; color: var(--muted); padding: 28px 12px; border: 2px dashed var(--line); border-radius: 14px; background: #fff; }
/* นำเข้า */
.drop { display: block; text-align: center; border: 2.5px dashed #9fd0b3; border-radius: 18px; padding: 26px 14px; background: linear-gradient(180deg, #fff, #f1f9f4); cursor: pointer; transition: .15s; }
.drop.over { border-color: var(--gb); background: var(--gl); }
.drop .ic { font-size: 40px; line-height: 1; } .drop b { display: block; font-size: 18px; color: var(--g); margin: 8px 0 2px; }
.drop input { display: none; }
.paste { width: 100%; min-height: 90px; border: 1.5px solid #cfe0d4; border-radius: 12px; padding: 10px; font-size: 13px; resize: vertical; }
/* สรุปตัวเลข */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
.kpi { border-radius: 16px; padding: 12px 14px; color: #fff; position: relative; overflow: hidden; }
.kpi.all { background: linear-gradient(135deg, #14432b, #1a6b3c); } .kpi.grab { background: linear-gradient(135deg, #00a24a, #00813b); } .kpi.lm { background: linear-gradient(135deg, #0b7a3e, #075a2d); }
.kpi small { display: block; font-size: 13px; font-weight: 700; opacity: .9; } .kpi b { display: block; font-size: 30px; line-height: 1.1; } .kpi span { font-size: 13px; opacity: .92; }
.kpi .lg { position: absolute; right: 10px; top: 10px; font-size: 12px; font-weight: 800; background: rgba(255,255,255,.2); border-radius: 99px; padding: 1px 8px; }
@media (max-width: 560px) { .kpis { grid-template-columns: 1fr 1fr; } .kpi.all { grid-column: 1 / -1; } .kpi b { font-size: 26px; } }
.hist { display: flex; gap: 8px; flex-wrap: wrap; }
.hist button { border: 1.5px solid #cfe0d4; background: #fff; border-radius: 12px; padding: 8px 12px; cursor: pointer; text-align: left; }
.hist button.on { border-color: var(--gb); background: var(--gl); } .hist button b { display: block; color: var(--g); } .hist button small { color: var(--muted); }
/* ตัวกรอง */
.seg { display: flex; background: #e6efe9; border-radius: 14px; padding: 4px; gap: 4px; margin-bottom: 12px; }
.seg button { flex: 1; min-height: 42px; border: 0; border-radius: 11px; background: transparent; font-weight: 800; color: var(--muted); cursor: pointer; }
.seg button.on { background: #fff; color: var(--g); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
.seg button .c { display: inline-block; min-width: 22px; font-size: 12px; background: var(--gl); color: var(--g); border-radius: 99px; padding: 0 6px; margin-left: 4px; }
.search { width: 100%; min-height: 46px; border: 1.5px solid #cfe0d4; border-radius: 12px; padding: 8px 12px; margin-bottom: 12px; background: #fff; }
.search:focus { outline: none; border-color: var(--gb); box-shadow: 0 0 0 3px rgba(45,138,82,.15); }
/* ออเดอร์ */
.od { background: #fff; border: 1px solid var(--line); border-radius: 16px; margin-bottom: 10px; overflow: hidden; }
.od-h { display: flex; gap: 10px; align-items: center; padding: 10px 12px; background: #f7fbf8; border-bottom: 1px solid #e6efe9; }
.dv { flex: none; font-size: 12.5px; font-weight: 800; color: #fff; border-radius: 99px; padding: 3px 10px; }
.dv.grab { background: var(--grab); } .dv.lm { background: var(--lm); } .dv.oth { background: #7a8a80; }
.od-h .cu { flex: 1; min-width: 0; } .od-h .cu b { display: block; font-size: 16px; } .od-h .cu small { color: var(--muted); font-size: 12.5px; }
.od-h .tt { text-align: right; font-weight: 800; color: var(--g); white-space: nowrap; } .od-h .tt small { display: block; font-weight: 600; color: var(--muted); font-size: 12px; }
.od-i { display: flex; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #f0f4f1; font-size: 14.5px; }
.od-i:last-child { border-bottom: 0; } .od-i .nm { flex: 1; min-width: 0; } .od-i .nm small { display: block; color: var(--muted); font-size: 12px; }
.od-i .q { flex: none; font-weight: 800; color: var(--g); min-width: 34px; text-align: right; }
/* รวมยอด */
table.sum { width: 100%; border-collapse: collapse; background: #fff; border-radius: 14px; overflow: hidden; font-size: 14.5px; }
table.sum th { background: var(--g); color: #fff; padding: 9px 8px; text-align: left; font-size: 13px; position: sticky; top: -14px; z-index: 1; }
table.sum td { padding: 8px; border-bottom: 1px solid #edf2ee; vertical-align: top; }
table.sum tr:nth-child(even) td { background: #f8fbf9; }
table.sum .n { text-align: right; white-space: nowrap; } table.sum .code { white-space: nowrap; font-weight: 700; color: var(--g); }
table.sum td small { display: block; color: var(--muted); font-size: 12px; }
table.sum tfoot td { background: var(--gl); font-weight: 800; color: var(--g); }
.qbig { font-size: 18px; font-weight: 800; color: var(--g); }
.wtag { display: inline-block; font-size: 11.5px; font-weight: 800; background: #fff4cc; color: #7a5600; border-radius: 99px; padding: 0 7px; }
.sum-wrap { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 12px; }
.sec-h { display: flex; align-items: center; gap: 8px; margin: 4px 0 8px; } .sec-h h3 { margin: 0; font-size: 17px; color: var(--g); flex: 1; }
/* modal */
.mo { position: fixed; inset: 0; background: rgba(10,30,18,.5); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.ms { background: #fff; width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 16px 16px calc(18px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 700px) { .mo { align-items: center; } .ms { border-radius: 20px; } }
.m-title { font-size: 18px; font-weight: 800; color: var(--g); margin-bottom: 8px; }
.m-actions { display: flex; gap: 8px; margin-top: 12px; } .m-actions .btn { flex: 1; }
.sap-info { background: var(--gl); border-radius: 12px; padding: 8px 12px; font-size: 14px; margin-bottom: 6px; }
.sap-cols { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
.sap-text { width: 100%; font: 13px ui-monospace, Consolas, monospace; border: 1.5px solid #cfe0d4; border-radius: 12px; padding: 10px; background: #f8fbf9; color: #1a2a1a; }
.sap-preview { max-height: 240px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; margin-top: 8px; }
.sap-preview table { width: 100%; border-collapse: collapse; font-size: 13px; } .sap-preview th, .sap-preview td { padding: 5px 8px; border-bottom: 1px solid #edf2ee; text-align: left; }
.sap-preview th { background: #eef6f1; position: sticky; top: 0; } .sap-preview .n { text-align: right; }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: #14432b; color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 99999; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 92vw; }
.toast.err { background: #a8281b; }
.pk-doc tr.sec td { background: #e8f5ee; color: #145f2f; font-weight: 800; padding-top: 6px; padding-bottom: 6px; }
</style>
<style>
/* ---------- ใบพิมพ์ (PrintKit) ---------- */
#pk-ov { position: fixed; inset: 0; z-index: 9999; background: #dfe6e2; display: flex; flex-direction: column; }
.pk-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; background: #14432b; color: #fff; padding-top: max(10px, env(safe-area-inset-top)); }
.pk-bar b { font-size: 16px; flex: 1 1 auto; }
#pk-ov .pk-bar select { font: 600 15px Sarabun, sans-serif; padding: 8px 10px; border-radius: 10px; border: 0; max-width: 100%; min-height: 0; color: #1b2b22; -webkit-text-fill-color: #1b2b22; background: #fff; flex: 1 1 180px; }
#pk-ov .pk-bar button { min-height: 0; }
.pk-bar button { font: 700 15px Sarabun, sans-serif; border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer; }
.pk-go { background: #f5c542; color: #3b2c00; }
.pk-x { background: rgba(255,255,255,.15); color: #fff; }
.pk-scroll { flex: 1; overflow: auto; padding: 14px 12px 30px; -webkit-overflow-scrolling: touch; }
.pk-sheet { background: #fff; width: 210mm; min-height: 297mm; margin: 0 auto; padding: 12mm; box-shadow: 0 4px 22px rgba(0,0,0,.18); }
.pk-msg { text-align: center; color: #4b5b52; font: 600 13px Sarabun, sans-serif; margin: 0 0 10px; }
#pk-print { display: none; }
.pk-doc { font-family: Sarabun, 'TH Sarabun New', sans-serif; color: #000; font-size: 12.5px; line-height: 1.35; }
.pk-doc .pk-head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 8px; }
.pk-doc h1 { font-size: 20px; margin: 0; font-weight: 800; }
.pk-doc .pk-sub { font-size: 12px; color: #333; }
.pk-doc .pk-docno { text-align: right; font-size: 12px; }
.pk-doc .pk-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 18px; margin-bottom: 8px; }
.pk-doc .pk-meta div { display: flex; gap: 6px; }
.pk-doc .pk-meta span { color: #444; min-width: 92px; }
.pk-doc table { width: 100%; border-collapse: collapse; }
.pk-doc th, .pk-doc td { border: 1px solid #000; padding: 3px 5px; vertical-align: top; }
.pk-doc th { background: #eee; font-weight: 700; text-align: center; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.pk-doc td.n, .pk-doc th.n { text-align: right; white-space: nowrap; }
.pk-doc td.c { text-align: center; white-space: nowrap; }
.pk-doc td.code { white-space: nowrap; }
.pk-doc td.blank { min-width: 60px; }
.pk-doc tr.hl td { background: #f2f2f2; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.pk-doc tfoot td { font-weight: 800; background: #f7f7f7; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.pk-doc thead { display: table-header-group; }
.pk-doc tr { break-inside: avoid; page-break-inside: avoid; }
.pk-doc .pk-sum { margin: 8px 0 0; font-size: 12.5px; }
.pk-doc .pk-note { margin-top: 8px; border: 1px solid #000; padding: 4px 6px; min-height: 42px; }
.pk-doc .pk-sign { display: grid; gap: 14px; margin-top: 26px; break-inside: avoid; page-break-inside: avoid; }
.pk-doc .pk-sign div { text-align: center; font-size: 12.5px; }
.pk-doc .pk-sign .ln { border-bottom: 1px dotted #000; height: 26px; margin: 0 6px 4px; }
.pk-doc .pk-foot { margin-top: 14px; font-size: 10.5px; color: #555; display: flex; justify-content: space-between; }
.pk-doc .pk-empty { text-align: center; padding: 18px; color: #555; }
/* ธีมเขียว */
.pk-doc { --pg: #145f2f; --pg2: #1a7a3c; --pgl: #e8f5ee; --pgm: #b8dfc8; }
.pk-doc .pk-head { border-bottom: 3px solid var(--pg2); }
.pk-doc .pk-kick { display: block; letter-spacing: .16em; font-size: 9.5px; color: var(--pg2); font-weight: 700; }
.pk-doc h1 { color: var(--pg); }
.pk-doc .pk-sub { color: var(--pg2); font-weight: 600; }
.pk-doc .pk-meta { gap: 6px; grid-template-columns: repeat(3, 1fr); }
.pk-doc .pk-meta div { display: block; background: var(--pgl); border-left: 3px solid var(--pg2); border-radius: 4px; padding: 3px 8px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.pk-doc .pk-meta span { display: block; font-size: 10px; min-width: 0; color: #4b6b55; }
.pk-doc th { background: var(--pg2); color: #fff; border-color: var(--pg2); }
.pk-doc td { border-color: var(--pgm); }
.pk-doc tbody tr:nth-child(even) td { background: #f6fbf8; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.pk-doc tr.hl td, .pk-doc tbody tr.hl:nth-child(even) td { background: #fdecea; }
.pk-doc tfoot td { background: var(--pgl); color: var(--pg); border-color: var(--pgm); }
.pk-doc .pk-note { border: 1px solid var(--pgm); border-left: 3px solid var(--pg2); border-radius: 4px; }
.pk-doc .pk-note b { color: var(--pg); }
.pk-doc .pk-sign b { color: var(--pg); }
.pk-doc .pk-foot { border-top: 1px solid var(--pgm); padding-top: 4px; }
@media print {
  @page { size: A4; margin: 10mm; }
  html, body { background: #fff !important; }
  body.pk-printing > *:not(#pk-print) { display: none !important; }
  body.pk-printing #pk-print { display: block !important; }
}
</style>
<script>
/* PrintKit — หน้าตัวอย่างใบพิมพ์ A4 + สั่งพิมพ์ (ใช้ร่วมกันทั้ง 3 แอป) */
window.PrintKit = (function () {
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c] }) }
  var pad = function (n) { return (n < 10 ? '0' : '') + n }
  function stamp() { var d = new Date(); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) }
  // doc = { title, sub, docNoLabel, meta:[[label,value]], cols:[{h, cls, w}], rows:[{cells:[], hl}], foot:[cells]|null, summary:html, noteBox:label|null, sign:[labels], empty }
  function render(doc) {
    var h = '<div class="pk-doc">'
    h += '<div class="pk-head"><div>' + (doc.kicker ? '<small class="pk-kick">' + esc(doc.kicker) + '</small>' : '') + '<h1>' + esc(doc.title) + '</h1>' + (doc.sub ? '<div class="pk-sub">' + esc(doc.sub) + '</div>' : '') + '</div>' +
      '<div class="pk-docno">' + esc(doc.docNoLabel || 'เลขที่เอกสาร') + ' ......................</div></div>'
    if (doc.meta && doc.meta.length) h += '<div class="pk-meta" style="grid-template-columns:repeat(' + (doc.meta.length % 4 === 0 ? 4 : 3) + ',1fr)">' + doc.meta.map(function (m) { return '<div><span>' + esc(m[0]) + '</span><b>' + esc(m[1]) + '</b></div>' }).join('') + '</div>'
    h += '<table><colgroup>' + doc.cols.map(function (c) { return '<col' + (c.w ? ' style="width:' + c.w + '"' : '') + '>' }).join('') + '</colgroup>'
    h += '<thead><tr>' + doc.cols.map(function (c) { return '<th' + (c.cls === 'n' ? ' class="n"' : '') + '>' + esc(c.h) + '</th>' }).join('') + '</tr></thead><tbody>'
    if (!doc.rows.length) h += '<tr><td colspan="' + doc.cols.length + '" class="pk-empty">' + esc(doc.empty || 'ไม่มีรายการ') + '</td></tr>'
    doc.rows.forEach(function (r) {
      if (r.sec) { h += '<tr class="sec"><td colspan="' + doc.cols.length + '">' + esc(r.sec) + '</td></tr>'; return }
      h += '<tr' + (r.hl ? ' class="hl"' : '') + '>' + r.cells.map(function (v, i) { var c = doc.cols[i].cls; return '<td' + (c ? ' class="' + c + '"' : '') + '>' + esc(v) + '</td>' }).join('') + '</tr>'
    })
    h += '</tbody>'
    if (doc.foot && doc.rows.length) h += '<tfoot><tr>' + doc.foot.map(function (v, i) { var c = doc.cols[i] && doc.cols[i].cls; return '<td' + (c ? ' class="' + c + '"' : '') + '>' + esc(v) + '</td>' }).join('') + '</tr></tfoot>'
    h += '</table>'
    if (doc.summary) h += '<div class="pk-sum">' + doc.summary + '</div>'
    if (doc.noteBox) h += '<div class="pk-note"><b>' + esc(doc.noteBox) + '</b></div>'
    if (doc.sign && doc.sign.length) {
      h += '<div class="pk-sign" style="grid-template-columns:repeat(' + doc.sign.length + ',1fr)">' + doc.sign.map(function (s) {
        return '<div><div class="ln"></div>(.......................................)<br><b>' + esc(s) + '</b><br>วันที่ ....../....../......</div>'
      }).join('') + '</div>'
    }
    h += '<div class="pk-foot"><span>พิมพ์เมื่อ ' + esc(stamp()) + '</span><span>' + esc(doc.footRight || '') + '</span></div>'
    return h + '</div>'
  }
  var ov = null
  function close() {
    if (ov) { ov.remove(); ov = null }
    document.removeEventListener('keydown', onKey, true)
  }
  function onKey(e) { if (e.key === 'Escape') { e.stopPropagation(); close() } }
  function fit() {
    if (!ov) return
    var sc = ov.querySelector('.pk-scroll'), sh = ov.querySelector('.pk-sheet')
    var w = sc.clientWidth - 24, full = 794 // 210mm ที่ 96dpi
    sh.style.zoom = w < full ? String(Math.max(0.3, w / full)) : ''
  }
  // cfg = { name, options:[[value,label]], value, build(value) -> doc }
  function open(cfg) {
    close()
    var cur = cfg.value || (cfg.options && cfg.options[0] ? cfg.options[0][0] : '')
    ov = document.createElement('div')
    ov.id = 'pk-ov'
    ov.innerHTML = '<div class="pk-bar"><b>🖨️ ' + esc(cfg.name || 'พิมพ์') + '</b>' +
      (cfg.options && cfg.options.length > 1 ? '<select class="pk-opt">' + cfg.options.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (o[0] === cur ? ' selected' : '') + '>' + esc(o[1]) + '</option>' }).join('') + '</select>' : '') +
      '<button type="button" class="pk-go">🖨️ สั่งพิมพ์</button><button type="button" class="pk-x">ปิด</button></div>' +
      '<div class="pk-scroll"><p class="pk-msg">ตัวอย่างใบพิมพ์ (A4) — ตรวจแล้วกด "สั่งพิมพ์" · บนมือถือเลือกเครื่องพิมพ์ หรือบันทึกเป็น PDF ได้</p><div class="pk-sheet"></div></div>'
    document.body.appendChild(ov)
    var draw = function () { ov.querySelector('.pk-sheet').innerHTML = render(cfg.build(cur)); fit() }
    var sel = ov.querySelector('.pk-opt')
    if (sel) sel.addEventListener('change', function () { cur = sel.value; draw() })
    ov.querySelector('.pk-x').addEventListener('click', close)
    ov.querySelector('.pk-go').addEventListener('click', function () { print(render(cfg.build(cur))) })
    document.addEventListener('keydown', onKey, true)
    window.addEventListener('resize', fit)
    draw()
  }
  function print(html) {
    var box = document.getElementById('pk-print')
    if (!box) { box = document.createElement('div'); box.id = 'pk-print'; document.body.appendChild(box) }
    box.innerHTML = html
    document.body.classList.add('pk-printing')
    var done = function () { document.body.classList.remove('pk-printing'); window.removeEventListener('afterprint', done) }
    window.addEventListener('afterprint', done)
    try { window.print() } catch (e) { done() }
  }
  return { open: open, close: close, render: render, print: print }
})()
</script>

<script>
/* ===== RangeKit: ดึงข้อมูลย้อนหลังตามช่วงวันที่ + ส่งออก Excel / CSV (ใช้ร่วมกันทุกแอป) ===== */
window.RK = (function () {
  const pad = (n) => (n < 10 ? '0' : '') + n
  const dk = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const xe = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '')
  const dTH = (k) => { const p = String(k || '').split('-'); return p.length === 3 ? Number(p[2]) + '/' + Number(p[1]) + '/' + p[0] : String(k || '') }
  const fname = (s) => String(s).replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, '_')
  function saveBlob(name, blob) {
    const url = URL.createObjectURL(blob), a = document.createElement('a')
    a.href = url; a.download = fname(name); a.style.display = 'none'
    document.body.appendChild(a); a.click(); a.remove()
    setTimeout(() => URL.revokeObjectURL(url), 8000)
  }
  // CSV: ใส่ BOM ให้ Excel อ่านภาษาไทยถูก
  function csv(name, heads, rows) {
    const c = (v) => { v = v == null ? '' : String(v); return /[",\r\n]/.test(v) || /^\s|\s$/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v }
    const txt = '﻿' + [heads].concat(rows).map((r) => r.map(c).join(',')).join('\r\n')
    saveBlob(name + '.csv', new Blob([txt], { type: 'text/csv;charset=utf-8' }))
  }
  // XLSX แบบไม่ต้องใช้ไลบรารี (zip store)
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0 } return t })()
  const crc32 = (u) => { let c = 0xffffffff; for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0 }
  function zip(files) {
    const enc = new TextEncoder(), parts = [], cen = []
    let off = 0
    files.forEach((f) => {
      const nm = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data)
      const h = new DataView(new ArrayBuffer(30))
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true)
      h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nm.length, true)
      parts.push(new Uint8Array(h.buffer), nm, data)
      const c = new DataView(new ArrayBuffer(46))
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true)
      c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, nm.length, true); c.setUint32(42, off, true)
      cen.push(new Uint8Array(c.buffer), nm)
      off += 30 + nm.length + data.length
    })
    const csz = cen.reduce((a, x) => a + x.length, 0), e = new DataView(new ArrayBuffer(22))
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csz, true); e.setUint32(16, off, true)
    return new Blob(parts.concat(cen, [new Uint8Array(e.buffer)]), { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })
  }
  function colName(i) { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26) } return s }
  function xlsx(name, heads, rows, widths, sheet) {
    const cell = (ref, v, st) => (typeof v === 'number' && isFinite(v)) ? '<c r="' + ref + '"' + (st ? ' s="' + st + '"' : '') + '><v>' + v + '</v></c>' : (v === '' || v == null ? '' : '<c r="' + ref + '" t="inlineStr"' + (st ? ' s="' + st + '"' : '') + '><is><t xml:space="preserve">' + xe(v) + '</t></is></c>')
    let sd = '<row r="1">' + heads.map((h, i) => cell(colName(i) + '1', h, 1)).join('') + '</row>'
    rows.forEach((r, k) => { const n = k + 2; sd += '<row r="' + n + '">' + r.map((v, i) => cell(colName(i) + n, v)).join('') + '</row>' })
    const W = widths || heads.map((h) => Math.max(10, Math.min(40, String(h).length + 6)))
    const X = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n', NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main', R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships'
    const ws = X + '<worksheet xmlns="' + NS + '"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>' + W.map((w, i) => '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>').join('') + '</cols><sheetData>' + sd + '</sheetData></worksheet>'
    const st = X + '<styleSheet xmlns="' + NS + '"><fonts count="2"><font><sz val="11"/><name val="Tahoma"/></font><font><b/><color rgb="FFFFFFFF"/><sz val="11"/><name val="Tahoma"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1A6B3C"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs></styleSheet>'
    saveBlob(name + '.xlsx', zip([
      { name: '[Content_Types].xml', data: X + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>' },
      { name: '_rels/.rels', data: X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="' + R + '/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
      { name: 'xl/workbook.xml', data: X + '<workbook xmlns="' + NS + '" xmlns:r="' + R + '"><sheets><sheet name="' + xe(String(sheet || 'ข้อมูล').slice(0, 31).replace(/[\\/?*[\]:]/g, '-')) + '" sheetId="1" r:id="rId1"/></sheets></workbook>' },
      { name: 'xl/_rels/workbook.xml.rels', data: X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="' + R + '/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="' + R + '/styles" Target="styles.xml"/></Relationships>' },
      { name: 'xl/styles.xml', data: st },
      { name: 'xl/worksheets/sheet1.xml', data: ws }
    ]))
  }
  // หน้าต่างเลือกช่วงวันที่ → ดึงข้อมูล → พิมพ์ / Excel / CSV
  function rangeModal(o) {
    const today = new Date(), back = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return dk(d) }
    const mStart = (k) => { const d = new Date(today.getFullYear(), today.getMonth() + k, 1); return dk(d) }
    const mEnd = (k) => { const d = new Date(today.getFullYear(), today.getMonth() + k + 1, 0); return dk(d) }
    const presets = [['7', 'ย้อนหลัง 7 วัน', back(6), dk(today)], ['14', '14 วัน', back(13), dk(today)], ['30', '30 วัน', back(29), dk(today)], ['m0', 'เดือนนี้', mStart(0), dk(today)], ['m1', 'เดือนก่อน', mStart(-1), mEnd(-1)]]
    const def = presets.find((p) => p[0] === String(o.days || 14)) || presets[1]
    const ov = document.createElement('div')
    ov.className = 'rk-ov'
    ov.innerHTML = '<div class="rk-box" role="dialog" aria-label="' + esc(o.title) + '"><h3>' + esc(o.title) + '</h3><p class="rk-sub">' + esc(o.sub || 'ข้อมูลทั้งหมดเก็บในชีต ดึงย้อนหลังได้ทุกวันที่') + '</p>' +
      '<div class="rk-chips">' + (o.presets === false ? [] : presets).map((p) => '<button type="button" data-rk-p="' + p[0] + '"' + (p === def && !o.from ? ' class="on"' : '') + '>' + p[1] + '</button>').join('') + '</div>' +
      '<div class="rk-dates"><label>ตั้งแต่วันที่<input type="date" id="rk-from" value="' + (o.from || def[2]) + '"></label><label>ถึงวันที่<input type="date" id="rk-to" value="' + (o.to || def[3]) + '"></label></div>' +
      '<button type="button" class="rk-btn pri" id="rk-go" style="width:100%">🔎 ดึงข้อมูล</button><div class="rk-res" id="rk-res"></div>' +
      '<button type="button" class="rk-btn rk-close" id="rk-x">ปิด</button></div>'
    document.body.appendChild(ov)
    const $ = (s) => ov.querySelector(s)
    const close = () => { ov.remove(); document.removeEventListener('keydown', onKey, true) }
    const onKey = (e) => { if (e.key === 'Escape' && !document.getElementById('pk-ov') && !document.getElementById('pv')) close() }
    document.addEventListener('keydown', onKey, true)
    ov.addEventListener('click', (e) => { if (e.target === ov) close() })
    $('#rk-x').onclick = close
    ov.querySelectorAll('[data-rk-p]').forEach((b) => { b.onclick = () => { const p = presets.find((x) => x[0] === b.dataset.rkP); $('#rk-from').value = p[2]; $('#rk-to').value = p[3]; ov.querySelectorAll('[data-rk-p]').forEach((x) => x.classList.toggle('on', x === b)); run() } })
    let busy = false, data = null
    async function run() {
      const from = $('#rk-from').value, to = $('#rk-to').value, res = $('#rk-res')
      if (!from || !to) { res.innerHTML = '<div class="rk-err">เลือกวันที่ให้ครบ</div>'; return }
      if (from > to) { res.innerHTML = '<div class="rk-err">วันที่เริ่มต้องไม่หลังวันที่สิ้นสุด</div>'; return }
      if (busy) return
      busy = true; $('#rk-go').disabled = true; $('#rk-go').textContent = 'กำลังดึงข้อมูล…'; res.innerHTML = ''
      try { data = await o.run(from, to) } catch (e) { data = null; res.innerHTML = '<div class="rk-err">ดึงข้อมูลไม่สำเร็จ: ' + esc(e && e.message ? e.message : e) + '</div>' }
      busy = false; $('#rk-go').disabled = false; $('#rk-go').textContent = '🔎 ดึงข้อมูล'
      if (!data) return
      const label = dTH(from) + ' – ' + dTH(to)
      if (!data.rows.length) { res.innerHTML = '<div class="rk-info">ไม่มีข้อมูลช่วง ' + esc(label) + '</div>'; return }
      res.innerHTML = '<div class="rk-info"><b>ช่วง ' + esc(label) + '</b><br>' + (data.summary || (data.rows.length + ' แถว')) + '</div>' + (data.extra || '') +
        '<div class="rk-row">' + (data.print ? '<button type="button" class="rk-btn pri" data-rk="print">🖨️ พิมพ์</button>' : '') + '<button type="button" class="rk-btn" data-rk="xlsx">📗 Excel</button><button type="button" class="rk-btn" data-rk="csv">📄 CSV</button></div>'
      const file = (data.file || o.title) + '_' + from + '_ถึง_' + to
      res.querySelectorAll('[data-rk]').forEach((b) => {
        b.onclick = () => {
          try {
            if (b.dataset.rk === 'print') data.print(from, to)
            else if (b.dataset.rk === 'xlsx') xlsx(file, data.heads, data.rows, data.widths, data.sheet || o.title)
            else csv(file, data.heads, data.rows)
          } catch (e) { alertBox(e) }
        }
      })
      if (data.bind) data.bind(res, from, to)
    }
    const alertBox = (e) => { const r = $('#rk-res'); const d = document.createElement('div'); d.className = 'rk-err'; d.textContent = 'ทำไม่สำเร็จ: ' + (e && e.message ? e.message : e); r.prepend(d) }
    $('#rk-go').onclick = run
    if (o.autoRun !== false) run()
    return { close: close }
  }
  // ค้นหาแบบใกล้เคียง: ตรงบางส่วน > ตัวอักษรเรียงตามลำดับ (ไม่ต้องพิมพ์ครบ)
  const norm = (s) => String(s || '').toLowerCase().replace(/[\s\-_.,()\/:'"+]+/g, '')
  function fuzzy(q, text) {
    const t = norm(text), toks = String(q || '').toLowerCase().split(/\s+/).map(norm).filter(Boolean)
    if (!toks.length) return -1
    let total = 0
    for (const k of toks) {
      const i = t.indexOf(k)
      if (i >= 0) { total += 1000 - Math.min(i, 500); continue }
      if (k.length < 3) return -1
      let last = -1, gaps = 0
      for (const ch of k) { const j = t.indexOf(ch, last + 1); if (j < 0) return -1; if (last >= 0) gaps += j - last - 1; last = j }
      if (gaps > k.length * 3) return -1
      total += 400 - gaps * 10
    }
    return total / toks.length
  }
  return { saveBlob: saveBlob, csv: csv, xlsx: xlsx, rangeModal: rangeModal, fuzzy: fuzzy, dTH: dTH, dk: dk }
})()
</script>

function readXls(buf) {
  const u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf)
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength)

    let i = byPos.get(sh.pos)
    if (i == null) return
    const rows = sh.rows
    const put = (row, col, v) => { (rows[row] = rows[row] || [])[col] = v }
    let pendingFormula = null
    for (i = i + 1; i < recs.length; i++) {
      const r = recs[i], p = r.p
      if (r.t === 0x000a) break
      if (r.t === 0x00fd) put(w.getUint16(p, true), w.getUint16(p + 2, true), sst[w.getUint32(p + 6, true)])
      else if (r.t === 0x0203) put(w.getUint16(p, true), w.getUint16(p + 2, true), w.getFloat64(p + 6, true))
      else if (r.t === 0x027e) put(w.getUint16(p, true), w.getUint16(p + 2, true), rk(w.getInt32(p + 6, true)))
      else if (r.t === 0x00bd) {
        const row = w.getUint16(p, true), c0 = w.getUint16(p + 2, true), c1 = w.getUint16(p + r.n - 2, true)
        for (let c = c0; c <= c1; c++) put(row, c, rk(w.getInt32(p + 4 + (c - c0) * 6 + 2, true)))
      } else if (r.t === 0x0204) put(w.getUint16(p, true), w.getUint16(p + 2, true), xlString(p + 6, 2))
      else if (r.t === 0x00d6) put(w.getUint16(p, true), w.getUint16(p + 2, true), xlString(p + 6, 2)) // RSTRING
      else if (r.t === 0x0006) {
        const row = w.getUint16(p, true), col = w.getUint16(p + 2, true)
        if (w.getUint16(p + 12, true) === 0xffff) {
          const k = wb[p + 6]
          if (k === 0) pendingFormula = [row, col]
          else if (k === 1) put(row, col, !!wb[p + 8])
          else put(row, col, '')
        } else put(row, col, w.getFloat64(p + 6, true))
      } else if (r.t === 0x0207 && pendingFormula) { put(pendingFormula[0], pendingFormula[1], xlString(p, 2)); pendingFormula = null }
    }

  const DV = { grab: 'Grab', lm: 'LINE MAN', oth: 'อื่น ๆ' }

  // แปลงตาราง (แถว x คอลัมน์) → ออเดอร์ · แถวที่เลขออเดอร์ว่าง = รายการของออเดอร์ล่าสุดด้านบน
  function rowsToDay(rows, src) {
    let hi = -1, H = null

      if (r.some((c) => /หมายเลขใบสั่งซื้อ|เลขที่ใบสั่งซื้อ/.test(c)) && r.some((c) => /^SKU$/i.test(c) || /ชื่อสินค้า/.test(c))) { hi = i; H = r; break }
    }
    if (hi < 0) return null
    const col = (re) => H.findIndex((c) => re.test(c))
    const C = { no: col(/หมายเลขใบสั่งซื้อ|เลขที่ใบสั่งซื้อ/), time: col(/วันที่/), cust: col(/ชื่อลูกค้า/), by: col(/จัดส่งโดย/), name: col(/ชื่อสินค้า/), sku: col(/^SKU$/i), qty: col(/^จำนวน$/), price: col(/ราคาต่อหน่วย/), total: col(/ราคารวม/) }

  function viewSum(d) {
    const rows = totals(d, sBy)
    $('#view').innerHTML = segHtml(sBy, true, d, 'data-sb') + unknownWarn(d) +
      '<div class="sec-h"><h3>' + (sBy === 'all' ? 'รวมทุกช่องทาง' : DV[sBy]) + ' · ' + rows.length + ' รหัส</h3><button type="button" class="btn sm pri" data-act="sap">📋 ข้อความ SAP</button></div>' +
      (rows.length ? sumTable(rows) : '<div class="emp">ไม่มีรายการ</div>') +
      '<p class="note">จำนวน = รวมทุกออเดอร์ของวัน · ออเดอร์ = มีสินค้านี้กี่ออเดอร์ · ข้อความ SAP ใช้ Whse ' + CFG.WHSE + ' และหน่วยจากฐานสินค้าเดียวกับทุกแอป</p>'
  }
  function dock(d) {
    const dis = d ? '' : ' disabled'
    $('#dock').innerHTML =
      '<button type="button" class="btn grow" data-act="pick">📂 นำเข้า</button>' +
      '<button type="button" class="btn pri grow" data-act="sap"' + dis + '>📋 SAP</button>' +
      '<button type="button" class="btn grow" data-act="print"' + dis + '>🖨️ พิมพ์</button>' +
      '<button type="button" class="btn grow" data-act="xlsx"' + dis + '>📗 Excel</button>'
  }

  /* ---------- ข้อความ SAP (เลือก Grab / LINE MAN / รวม) ---------- */
  let modal = null
  function openModal(html) { closeModal(); modal = document.createElement('div'); modal.className = 'mo'; modal.innerHTML = '<div class="ms">' + html + '</div>'; modal.addEventListener('click', (e) => { if (e.target === modal) closeModal() }); document.body.appendChild(modal); return modal }
  function closeModal() { if (modal) { modal.remove(); modal = null } }
  function openSap() {
    const d = cur(); if (!d) return
    let by = view === 'sum' ? sBy : 'grab'
    if (by === 'oth') by = 'all'
    const sh = openModal('<div class="m-title">📋 ข้อความสำหรับวางลง SAP</div><div id="sap-seg"></div><div class="sap-info" id="sap-info"></div><div class="sap-cols">คอลัมน์ B–E: Item No. → Whse → Quantity → UoM Code (มีแถวหัวคอลัมน์)</div><textarea class="sap-text" id="sap-text" rows="9" readonly spellcheck="false"></textarea><div class="sap-preview" id="sap-prev"></div><div class="m-actions"><button type="button" class="btn" data-x="no">ปิด</button><button type="button" class="btn pri" data-x="copy">📋 คัดลอกข้อความ</button></div>')
    const draw = () => {
      $('#sap-seg', sh).innerHTML = segHtml(by, true, d, 'data-mb')
      const r = sapText(d, by, true), s = stats(d, by)
      $('#sap-info', sh).innerHTML = '<b>' + (by === 'all' ? 'รวมทุกช่องทาง' : DV[by]) + '</b> · ' + esc(dTH(d.date)) + ' · ' + s.orders + ' ออเดอร์ · <b>' + r.rows.length + '</b> รหัส · Whse <b>' + CFG.WHSE + '</b>'
      $('#sap-text', sh).value = r.text
      $('#sap-prev', sh).innerHTML = '<table><thead><tr><th>Item No.</th><th>Whse</th><th class="n">Quantity</th><th>UoM Code</th></tr></thead><tbody>' + r.rows.map((x) => '<tr><td>' + esc(x.sku) + '</td><td>' + CFG.WHSE + '</td><td class="n"><b>' + fmtNum(x.qty) + '</b></td><td>' + esc(x.pack || '⚠️ ไม่มีหน่วย') + (x.known ? '' : ' ⚠️') + '</td></tr>').join('') + '</tbody></table>'
      sh.querySelectorAll('[data-mb]').forEach((b) => { b.onclick = () => { by = b.dataset.mb; draw() } })
    }
    $('[data-x=no]', sh).onclick = closeModal
    $('[data-x=copy]', sh).onclick = async () => {
      const ta = $('#sap-text', sh), n = sapText(d, by, false).rows.length
      let ok = false
      try { await navigator.clipboard.writeText(ta.value); ok = true } catch (e) { /* วิธีเก่า */ }
      if (!ok) { try { ta.focus(); ta.select(); ok = document.execCommand('copy') } catch (e) { ok = false } }
      if (ok) toast('📋 คัดลอก ' + (by === 'all' ? 'รวมทุกช่องทาง' : DV[by]) + ' ' + n + ' รหัสแล้ว — ไปวางใน SAP ได้เลย', 'ok', 3000)
      else { ta.focus(); ta.select(); toast('คัดลอกอัตโนมัติไม่ได้ — ข้อความถูกเลือกไว้แล้ว กด Ctrl+C', 'err', 4000) }
    }
    draw()
  }

  /* ---------- เพิ่มสินค้าที่ไม่มีในฐาน → ฐานสินค้าเดียวกับทุกแอป (ส่งขึ้นชีตเมื่อเปิดแอปรับเข้า/ตีคืน/สั่งของ) ---------- */
  function openAddProd() {
    const d = cur(); if (!d) return
    const miss = new Map()
    d.orders.forEach((o) => o.items.forEach((i) => { if (!products[i.sku]) miss.set(i.sku, i.name) }))
    if (!miss.size) { toast('ทุกรหัสมีในฐานสินค้าแล้ว'); return }
    const list = Array.from(miss.entries())
    const sh = openModal('<div class="m-title">➕ เพิ่มสินค้าเข้าฐานสินค้า</div><p class="note" style="margin:0 0 10px">ใส่ชื่อและหน่วย (UoM ใน SAP เช่น PACK 250g) — ใช้ร่วมกับทุกแอป และจะส่งขึ้นแท็บ ฐานสินค้า ในชีตเมื่อเปิดแอปรับเข้า / ตีคืน / สั่งสินค้า</p>' +
      list.map((x, i) => '<div class="card" style="padding:10px;margin-bottom:8px"><b style="color:var(--g)">' + esc(x[0]) + '</b><input class="search" style="margin:6px 0" data-ap-n="' + i + '" value="' + esc(x[1].replace(/\s*\(?\s*[\d.]+\s*(g|kg|pc|pcs|pce|ml)\b[^)]*\)?\s*$/i, '').trim() || x[1]) + '" placeholder="ชื่อสินค้า"><input class="search" style="margin:0" data-ap-p="' + i + '" value="' + esc(guessPack(x[1])) + '" placeholder="หน่วย เช่น PACK 250g"></div>').join('') +
      '<div class="m-actions"><button type="button" class="btn" data-x="no">ยกเลิก</button><button type="button" class="btn pri" data-x="ok">บันทึก</button></div>')
    $('[data-x=no]', sh).onclick = closeModal
    $('[data-x=ok]', sh).onclick = () => {
      const extra = lsGet('rc_products_extra', {}) || {}, push = lsGet('rc_products_push', {}) || {}
      let n = 0, bad = 0
      list.forEach((x, i) => {
        const nm = $('[data-ap-n="' + i + '"]', sh).value.trim(), pk = $('[data-ap-p="' + i + '"]', sh).value.trim()
        if (!nm || !pk) { bad++; return }
        extra[x[0]] = [nm, pk]; push[x[0]] = [nm, pk]; n++
      })
      if (bad) { toast('ใส่ชื่อและหน่วยให้ครบทุกรหัส', 'err'); return }
      lsSet('rc_products_extra', extra); lsSet('rc_products_push', push)
      rebuildProducts(); closeModal(); render()
      toast('➕ เพิ่ม ' + n + ' รหัสเข้าฐานสินค้าแล้ว')
    }
  }
  /* ---------- พิมพ์ ---------- */
  function openPrint() {
    const d = cur(); if (!d) return
    window.PrintKit.open({
      name: 'พิมพ์คีย์ยอดพระราม 4',
      options: [['sum', 'สรุปรวมยอดแยก Grab / LINE MAN'], ['orders', 'รายการออเดอร์แยกการจัดส่ง (มีชื่อลูกค้า)']],
      build: (m) => {
        const a = stats(d, 'all'), g = stats(d, 'grab'), l = stats(d, 'lm')
        const doc = {
          kicker: 'DELIVERY ORDERS · RAMA 4', title: m === 'sum' ? 'สรุปรวมยอดสินค้าขายเดลิเวอรี่' : 'รายการออเดอร์เดลิเวอรี่', sub: 'สาขาพระราม 4 · ' + dTH(d.date),
          meta: [['วันที่', dTH(d.date)], ['Grab', g.orders + ' ออเดอร์ · ' + fmtNum(g.items) + ' ชิ้น'], ['LINE MAN', l.orders + ' ออเดอร์ · ' + fmtNum(l.items) + ' ชิ้น']],
          noteBox: 'หมายเหตุ:', sign: ['ผู้คีย์ยอด', 'ผู้ตรวจสอบ', 'ผู้จัดการสาขา'], empty: 'ไม่มีรายการ', footRight: 'แอปคีย์ยอดพระราม 4 · Whse ' + CFG.WHSE
        }
        const rows = []
        const groups = ['grab', 'lm'].concat(stats(d, 'oth').orders ? ['oth'] : [])
        if (m === 'sum') {
          doc.cols = [{ h: 'ลำดับ', cls: 'c', w: '7%' }, { h: 'รหัสสินค้า', cls: 'code', w: '13%' }, { h: 'ชื่อสินค้า' }, { h: 'หน่วย (UoM)', w: '15%' }, { h: 'จำนวนรวม', cls: 'n', w: '11%' }, { h: 'ออเดอร์', cls: 'c', w: '9%' }]
          groups.forEach((by) => {
            const t = totals(d, by), s = stats(d, by)
            rows.push({ sec: (by === 'oth' ? 'อื่น ๆ' : DV[by]) + ' · ' + s.orders + ' ออเดอร์ · ' + t.length + ' รหัส · ' + fmtNum(s.items) + ' ชิ้น' })
            t.forEach((x, i) => rows.push({ cells: [i + 1, x.sku, x.name, x.pack || '-', fmtNum(x.qty), x.orders.size], hl: !x.known }))
          })
          doc.foot = ['', '', 'รวมทั้งหมด ' + a.orders + ' ออเดอร์', '', fmtNum(a.items), '']
        } else {
          doc.cols = [{ h: 'เลขออเดอร์', w: '15%' }, { h: 'ลูกค้า', w: '13%' }, { h: 'เวลา', cls: 'c', w: '7%' }, { h: 'รหัส', cls: 'code', w: '11%' }, { h: 'สินค้า' }, { h: 'จำนวน', cls: 'n', w: '8%' }, { h: 'ราคารวม', cls: 'n', w: '10%' }]
          groups.forEach((by) => {
            const os = d.orders.filter((o) => o.by === by)
            rows.push({ sec: (by === 'oth' ? 'อื่น ๆ' : DV[by]) + ' · ' + os.length + ' ออเดอร์' })
            os.forEach((o) => o.items.forEach((i, k) => rows.push({ cells: [k ? '' : o.no, k ? '' : o.cust, k ? '' : o.time, i.sku, info(i.sku, i.name).name, fmtNum(i.qty), baht(i.total)] })))
          })
          doc.foot = ['', '', '', '', 'รวม ' + a.orders + ' ออเดอร์', fmtNum(a.items), baht(a.baht)]
        }
        doc.rows = rows
        return doc
      }
    })
  }

  /* ---------- Excel ---------- */
  function exportXlsx() {
    const d = cur(); if (!d) return
    const by = view === 'sum' ? sBy : view === 'orders' ? fBy : 'all'
    if (view === 'orders') {
      const os = d.orders.filter((o) => by === 'all' || o.by === by), rows = []
      os.forEach((o) => o.items.forEach((i) => { const f = info(i.sku, i.name); rows.push([o.no, o.cust, o.by === 'oth' ? o.byRaw : DV[o.by], o.date, o.time, i.sku, f.name, f.pack, i.qty, i.price, i.total]) }))
      RK.xlsx('ออเดอร์_พระราม4_' + (by === 'all' ? 'ทั้งหมด' : DV[by] || by) + '_' + d.date, ['เลขออเดอร์', 'ชื่อลูกค้า', 'จัดส่งโดย', 'วันที่', 'เวลา', 'รหัสสินค้า', 'ชื่อสินค้า', 'หน่วย', 'จำนวน', 'ราคาต่อหน่วย', 'ราคารวม'], rows, [14, 14, 11, 12, 8, 12, 38, 14, 9, 11, 11], 'ออเดอร์')
    } else {
      const b2 = by === 'oth' ? 'all' : by
      const rows = totals(d, b2).map((x) => [x.sku, CFG.WHSE, x.qty, x.pack, x.name, x.orders.size])
      RK.xlsx('รวมยอด_พระราม4_' + (b2 === 'all' ? 'ทั้งหมด' : DV[b2]) + '_' + d.date, ['Item No.', 'Whse', 'Quantity', 'UoM Code', 'ชื่อสินค้า', 'จำนวนออเดอร์'], rows, [12, 8, 10, 14, 38, 12], 'รวมยอด')
    }
    toast('📗 ส่งออก Excel แล้ว')
  }

  /* ---------- เหตุการณ์ ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-v],[data-go],[data-day],[data-fb],[data-sb],[data-act]')
    if (!t || t.disabled) return
    if (t.dataset.v) setView(t.dataset.v)
    else if (t.dataset.go) setView(t.dataset.go)
    else if (t.dataset.day) { sel = t.dataset.day; lsSet(K.sel, sel); render() }
    else if (t.dataset.fb) { fBy = t.dataset.fb; render() }
    else if (t.dataset.sb) { sBy = t.dataset.sb; render() }
    else if (t.dataset.act === 'pick') { if (view !== 'import') setView('import'); setTimeout(() => { const f = $('#file'); if (f) f.click() }, 30) }
    else if (t.dataset.act === 'sap') openSap()
    else if (t.dataset.act === 'print') openPrint()
    else if (t.dataset.act === 'xlsx') exportXlsx()
    else if (t.dataset.act === 'addprod') openAddProd()
  })
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal && !document.getElementById('pk-ov')) closeModal() })
  if (!DAYS[sel]) { const ks = Object.keys(DAYS).sort(); sel = ks.length ? ks[ks.length - 1] : '' }
  render()
  refreshProducts()
  if (window.__KR4_TEST) window.__KR4 = { rowsToDay: rowsToDay, readAny: readAny, totals: totals, sapText: sapText, stats: stats, cur: cur, products: () => products }
})()
</script>
</body>
</html>
